[package]
name = "lumenwright"
description = "Offline, headless renderer for Minecraft Java Edition worlds: a vanilla-look rasterizer and a path tracer, on the CPU, Metal, Vulkan, DX12 and CUDA"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.90"
readme = "../../README.md"
documentation = "https://docs.rs/lumenwright"
keywords = ["minecraft", "renderer", "path-tracing", "voxel", "wgpu"]
categories = ["rendering", "graphics", "game-development"]
include = ["/src", "/assets", "/build.rs", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12080"], optional = true }
fastnbt = "2.6.3"
flate2 = "1.1.10"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
lumenwright-kernel = { version = "=0.2.0", path = "../lumenwright-kernel", default-features = false, features = ["std"] }
lz4_flex = "0.14.0"
pollster = { version = "1.0.1", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = { version = "30.0.1", optional = true }
# Jars and resource packs are deflate-only; the decoder is flate2's, the one the
# region reader already uses, so no other compression method is linked.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }

[features]
default = ["gpu"]
# Metal / Vulkan / DX12 backends via wgpu.
gpu = ["dep:wgpu", "dep:pollster"]
# CUDA backend: runs the lumenwright-kernel crate compiled to PTX (scripts/build-ptx.sh).
cuda = ["dep:cudarc"]
