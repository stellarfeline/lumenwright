[package]
name = "lumenwright"
description = "Offline headless Minecraft world renderer"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12080"], optional = true }
env_logger = "0.11.11"
fastnbt = "2.6.3"
flate2 = "1.1.10"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
lumenwright-kernel = { version = "0.1.0", path = "../lumenwright-kernel", default-features = false, features = ["std"] }
lz4_flex = "0.14.0"
pollster = { version = "1.0.1", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
ureq = "3.4.2"
wgpu = { version = "30.0.1", optional = true }
zip = "9.0.3"

[features]
default = ["gpu"]
# Metal / Vulkan / DX12 backends via wgpu.
gpu = ["dep:wgpu", "dep:pollster"]
# CUDA backend: runs the lumenwright-kernel crate compiled to PTX (scripts/build-ptx.sh).
cuda = ["dep:cudarc"]
