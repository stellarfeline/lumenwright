[package]
name = "lumenwright-ptx"
description = "CUDA entry point: lumenwright-kernel compiled to PTX (nvptx64-nvidia-cuda)"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
lumenwright-kernel = { path = "../lumenwright-kernel" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
