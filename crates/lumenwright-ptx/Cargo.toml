[package]
name = "lumenwright-ptx"
description = "CUDA entry point: lumenwright-kernel compiled to PTX (nvptx64-nvidia-cuda)"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
# Not published: a nightly-only cdylib for nvptx64-nvidia-cuda whose only consumer is
# scripts/build-ptx.sh in this repository, which writes the PTX the `cuda` feature embeds.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lumenwright-kernel = { path = "../lumenwright-kernel" }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
