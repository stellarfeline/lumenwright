[package]
name = "lumenwright-kernel"
description = "The no_std path-tracing kernel of the lumenwright Minecraft renderer, shared by its CPU and CUDA backends"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
readme = "README.md"
documentation = "https://docs.rs/lumenwright-kernel"
keywords = ["minecraft", "path-tracing", "no-std", "cuda", "ptx"]
categories = ["rendering", "no-std", "no-std::no-alloc"]
include = ["/src", "/README.md", "/LICENSE"]

[features]
default = ["libm"]
# Use std's hardware float intrinsics on the host (the CPU backend enables this).
std = []
# Pure-Rust float math for no_std targets (nvptx64-nvidia-cuda).
libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2", optional = true }
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
