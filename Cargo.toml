[workspace]
resolver = "3"
members = ["crates/lumenwright", "crates/lumenwright-cli", "crates/lumenwright-kernel"]
# The PTX crate only builds for nvptx64-nvidia-cuda; see scripts/build-ptx.sh.
exclude = ["crates/lumenwright-ptx"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/stellarfeline/lumenwright"

[profile.release]
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
